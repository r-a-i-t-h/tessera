      <p>
      	<span style="font-size:24px;"><span style="color:#ff0000;">RED LETTER DAYS</span></span></p>
      <p>
      	<img alt="Red letter day" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Red letter day/Red letter day - web 2.jpg" style="width: 250px; height: 335px; float: right; margin: 10px;" />Red Letter Days at Miller's Ark guarantee a unique hands on experience of farming life. Go behind the scenes of a Rare Breeds farm. Experience all aspects of daily farm life by joining the farm team for the day. Your Red Letter Day will include animal husbandry, making the animal pens clean and comfy, food preparation, visiting the fields and helping administer any medical treatment. This experience is great for adults of any age!</p>
      <p>
      	<span style="color:#ff0000;"><strong>GIVING A RED LETTER DAY EXPERIENCE AS A GIFT?</strong></span></p>
      <p>
      	Choose your option and contact the office with all the relevant details and we will email you a certificate to give to your loved one. Please note our minimum age for a Red Letter Day experience is 16. Farmer for the Day gift packages are available for 15 year olds and under.</p>
      <p>
      	<strong>WHEN CAN YOU ATTEND?</strong></p>
      <p>
      	Your day can be booked all through the year. Farm animals need to be looked after 365 days a year, so your special day will not be cancelled due to bad weather.</p>
      <p>
      	<strong>DRESS CODE?</strong></p>
      <p>
      	Wear comfy clothes and depending on the time of year, it is advisable to bring wellies and waterproof clothes with you.</p>
      <p>
      	<span style="color:#ff0000;"><strong>WHAT WILL YOUR RED LETTER DAY INVOLVE?</strong></span></p>
      <p>
      	Whichever option you choose your Red Letter Day will commence with a tea/coffee in our Staff Room where you will meet the team and be given a short HSE chat about working safely around the farm.</p>
      <p>
      	<strong>OPTION 1: FULL DAY FROM 11am - 5pm COST £85.00.</strong></p>
      <p>
      	<strong><img alt="Red letter day" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Red letter day/Red letter day - web 3.JPG" style="width: 250px; height: 333px; float: right; margin: 10px;" /></strong></p>
      <p>
      	Morning duties can involve:</p>
      <ul>
      	<li>
      		<p>
      			letting out all the animals from their night time pens</p>
      	</li>
      	<li>
      		<p>
      			feeding and watering the animals</p>
      	</li>
      	<li>
      		<p>
      			collecting eggs</p>
      	</li>
      	<li>
      		<p>
      			administering medical care</p>
      	</li>
      	<li>
      		<p>
      			grooming ponies and donkeys, cuddling goats and learning how to care for them,  moving pigs and understanding their behaviour, handling chicken and chicks, ducks and geese.</p>
      	</li>
      </ul>
      <p>
      	Break for lunch with a deliciously tasty Ploughmans.</p>
      <p>
      	The afternoon can include:</p>
      <ul>
      	<li>
      		<p>
      			driving to all the local fields to check our cattle, sheep and pigs taking fresh straw and water to the animals</p>
      	</li>
      	<li>
      		<p>
      			collecting any animals that need bringing back to the farm</p>
      	</li>
      	<li>
      		<p>
      			a break for another cup of tea/coffee</p>
      	</li>
      	<li>
      		<p>
      			afternoon feed up including filling the hay mangers, chopping up fresh vegetables and filling the animals water troughs</p>
      	</li>
      </ul>
      <p>
      	Finish the day with a well earned cup of tea and homemade cake in the Staff Room.</p>
      <p>
      	<strong>OPTION 2: HALF DAY FROM 1.30pm - 5pm COST £55.00.</strong></p>
      <p>
      	Activities can include:</p>
      <ul>
      	<li>
      		<strong><img alt="Red letter day" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Red letter day/Red letter day - web 1.JPG" style="width: 250px; height: 335px; margin: 10px; float: right;" /></strong>
      		<p>
      			ensuring all farm animals have fresh water food and hay before climbing into a 4 x 4 to visit our conservation grazing sheep and cows</p>
      	</li>
      	<li>
      		<p>
      			grooming ponies and donkeys, cuddling goats and learning how to care for them,  moving pigs and understanding their behaviour, handling chicken and chicks, ducks and geese.</p>
      	</li>
      	<li>
      		<p>
      			strawing down the animal shelters and making sure fresh water is available</p>
      	</li>
      	<li>
      		<p>
      			 a return to the home farm for a break and hot drink</p>
      	</li>
      	<li>
      		<p>
      			assisting in the evening feed up and help bring all the animals in to their night pens</p>
      	</li>
      </ul>
      <p>
      	The day ends in the Staff Room with a cup of tea and homemade cake.</p>
      <p>
      	<strong>HOW MANY PEOPLE CAN ATTEND?</strong></p>
      <p>
      	We recommend no more than 3 friends or family attend with you, so everyone gets the most from their day. <strong>The voucher is for one person,  friends or family will need to purchase additional vouchers.</strong></p>
      <p>
      	<strong>WHERE ARE WE?</strong></p>
      <p>
      	Approximately 5 minutes off junction 5 of the M3 between Hook and Basingstoke in Hampshire. Hook train station is the nearest and a bus passes along the A30</p>
      <p>
      	 </p>
