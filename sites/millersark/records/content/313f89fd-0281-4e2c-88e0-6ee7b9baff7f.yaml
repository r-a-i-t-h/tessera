      <div style="padding: 10px 20px;">
      	<p>
      		The fun and games continue at Miller's Ark Animals this Saturday 1st October and Sunday 2nd October at 11am, children (and adults) can have their face painted, try their hand at making sand paintings, enjoy a sing a long with Geoff and friends, welly wanging and one for the dads..... our tug of war competition!<br />
      		That is before you even get to the animals who will be waiting for you. Whether you like cuddling baby donkeys, grooming the ponies, playing with lively goats, tickling a pig’s tummy, or sitting holding<span class="text_exposed_hide">...</span><span class="text_exposed_show"> a duck, chick or guinea pig our animals will provide hours of entertainment. We have built a giant straw play area, and our "tyre" swings have made a popular come back! An alternative menu to usual will be served all day, and we have a picnic area too! </span></p>
      	<p>
      		Adults & Children £6 Under 2's FREE. Car parking FREE, Disabled car spaces available near the entrance.<span _fck_bookmark="1" style="display: none;"> </span></p>
