  main:
    html: |
      <p>
      	We bring everything we need, except water, and clean up thoroughly as we go and on our departure.</p>
      <p>
      	We apply for all animal movement licences from DEFRA and carry £10,000,000 public liability insurance with the NFU Mutual.</p>
      <p>
      	A risk assessment is available for each visit and we are regularly monitored by Animal Health and government welfare bodies.</p>
      <p>
      	Our Animal Activity Licence number is: 19/00315/AWAAL</p>
      <p>
      	Pregnant women are advised not to touch sheep and young lambs as a simple precaution.</p>
      <p>
      	All the animals are bred on the farm and very friendly, enjoying contact with children and members of the public.</p>
