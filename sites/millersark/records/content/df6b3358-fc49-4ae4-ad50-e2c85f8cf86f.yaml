  main:
    html: |
      <p>
      	<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Liz and boys (Origins).jpg" style="width: 240px; height: 320px; float: right; " />Miller's Ark Animals was first established in 1991 by Elizabeth Miller to offer a special interactive experience with her friendly farm animals.</p>
      <div>
      	One of the original 'mobile farms', Miller's Ark pioneered school and nursery travelling farm visits with the motto 'We bring the farm to you'. In 1994 residential homes, shows and corporate events were added to the portfolio.</div>
      <div>
      	 </div>
      <div>
      	Elizabeth launched Animal Touch (registered charity 1105059) in 2002, reflecting the growing demand for therapeutic interaction with the farm animals. Animal Touch welcomes visits on the farm by individuals or groups with special needs and can also take animals to private homes or specialist centres. These visits are heavily subsidised and reliant on donations. Anyone can approach Animal Touch for a therapeutic session and referrals can be made by GPs, social services and health care officials. </div>
