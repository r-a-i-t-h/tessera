      - type: text
        html: |
          <p>
          	Established in 1998 with money left to her by her late father, Elizabeth founded the Swanthorpe herd on three Irish Moiled cattle bought from Libby Clarke and Gordon Stockdale in Northern Ireland, and the herd grew steadily to be the largest in England. Irish Moileds are one of the rarest traditional breeds of cattle,but interest and enthusiasm from many committed breeders is now increasing their numbers and viability. With more commitments to the 'mobile' side of the farm, Elizabeth has gradually reduced numbers and now the herd runs at around twenty five cows at any one time. Youngsters are occasionally available for sale and the herd bulls are available for hire.</p>
