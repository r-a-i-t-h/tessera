  main:
    html: |
      <div>
      	Miller's Ark Animals was established in 1991 by Elizabeth Miller B.A. Cantab, as an offshoot of her main farming business and has expanded steadily ever since, along with Animal Touch, the charity central to the farm.</div>
      <div>
      	 </div>
      <div>
      	Miller's Ark Animals brings the sights, sounds and experiences of the farmyard to the heart of your show, corporate event, school, nursery or residential home. </div>
      <div>
      	 </div>
      <div style="text-align: center; ">
      	<img alt="Miller's Ark staff trip to Whipsnade Zoo" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/2015/Staff outing.jpg" style="width: 700px; height: 340px;" /><br />
      	<span style="font-size:11px;"><em>Miller's Ark staff on a day trip to Whipsnade Zoo June 2015</em></span></div>
      <div>
      	 </div>
      <div>
      	<div>
      		Miller's Ark Animals/Animal Touch are based on the Earl of Malmesbury's estate at Hook in Hampshire and the home farm specialises in breeding Irish Moiled rare breed cattle, traditional Belted Galloways, rare breed sheep, Pygmy goats. Kune Kune pigs, standard and miniature donkeys, ducks, geese, turkeys and chicken.</div>
