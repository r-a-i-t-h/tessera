      <p>
      	<img src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Xmas/Christmas table 2.jpg" style="width: 220px; height: 150px; margin-right: 10px; float: left;" /><span style="font-size: 14px;"><span style="font-family: tahoma,geneva,sans-serif;">               "LADIES and GENTS WHO LUNCH? </span></span></p>
      <p>
      	Are you bored with pub lunches at Christmas time? Then experience a Christmas "get together" at Miller's Ark.</p>
      <p>
      	Meet up with your friends, club members or school mums, and enjoy a 3 course meal in the warmth of our heated traditional tea barn, complete with Christmas carols, Christmas decorations and of course a real Christmas tree. A warm welcome awaits each member of your group together with a complimentary glass of hot punch and of course no Christmas table would be complete without complementary Christmas crackers!</p>
      <p>
      	                                                              DATES STILL AVAILABLE :</p>
      <p>
      	                   WEDNESDAY 4TH DECEMBER, THURSDAY 5TH  OR FRIDAY 6TH DECEMBER</p>
      <p>
      	               WEDNESDAY 11TH DECEMBER, THURSDAY 12TH  OR FRIDAY 13TH DECEMBER</p>
      <p>
      	                                                                TIME 1.00pm - 3.00pm</p>
      <p>
      	Booking is easy!</p>
      <ul>
      	<li>
      		Choose your date</li>
      	<li>
      		Select a starter, main and dessert for each person in your group from the menu below</li>
      	<li>
      		Pay your remittance in full either by paypal or BACS</li>
      	<li>
      		Email your choices to <a href="mailto:elizabeth@millersark.co.uk">elizabeth@millersark.co.uk</a></li>
      	<li>
      		Please note this Christmas event is non refundable</li>
      </ul>
