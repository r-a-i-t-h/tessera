zones:
  title:
    html: Christmas on the farm
  main:
    html: |-
      <script>
      if (String(document.location).match("/christmas\.aspx$")) {
        // Redirects to the first published page under /christmas/ according to the page footer
        $(function() {
          var url = $("#footer a[href*='/christmas/']").eq(0).attr('href');
          if (typeof(url) !== "undefined" && url) {
            document.location = url;
          }
        });
      } else {
        // must be in edit mode - do nothing
      }
      </script>
