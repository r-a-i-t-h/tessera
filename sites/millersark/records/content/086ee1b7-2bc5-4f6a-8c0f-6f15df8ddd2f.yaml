  main:
    html: |-
      <p>
      	The risk assessment below is also available as a PDF document which is easier to print:</p>
      <p style="text-align: center; ">
      	<a href="https://www.millersark.co.uk/Web/Site/MillersArk/Res/File/Documents/Risk assessments/CURRENT MOBILE RISK ASSESSMENT 2012.pdf" target="_blank"><img alt="Mobile Farm risk assessment in Adobe PDF format" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/pdf_icon.gif" style="width: 51px; height: 49px; border-width: 0px; border-style: solid; vertical-align: middle; " /></a><a href="https://www.millersark.co.uk/Web/Site/MillersArk/Res/File/Documents/Risk%20assessments/CURRENT%20MOBILE%20RISK%20ASSESSMENT%202012.pdf" target="_blank">Mobile Farm risk assessment in Adobe PDF format</a> (113kb)</p>
      <p>
      	 </p>
      <table border="0" cellpadding="0" cellspacing="0" class="std" style="width: 98%; " width="999">
      	<tbody>
      		<tr>
      			<th style="">
      				<p>
      					Identifying significant hazards and how they can harm</p>
      			</th>
      			<th style="">
      				<p>
      					Deciding who is at risk</p>
      			</th>
      			<th style="">
      				<p>
      					After evaluation these controls are put in place to minimise risk</p>
      			</th>
      		</tr>
      		<tr>
      			<td style="vertical-align: top; ">
      				<p>
      					Being bitten or knocked over by an animal</p>
      			</td>
      			<td style="vertical-align: top; ">
      				<p>
      					Any member of the public and staff</p>
      			</td>
      			<td style="width:652px;">
      				<p>
      					<strong>Livestock management procedure:</strong></p>
      				<p style="margin-left:46.35pt;">
      					1.    Our animals are penned securely and are used to being handled and travelling to events. This reduces the risk of stress related accidents.</p>
      				<p>
      					<strong>Training and Supervision:</strong></p>
      				<p style="margin-left:46.35pt;">
      					2.    There is close supervision by trained and experienced Miller’s Ark staff and it is our intention that no member of the general public is allowed to pick up or touch any animals without a member of staff being present.</p>
      				<p>
      					<strong>Insurance</strong></p>
      				<p style="margin-left:46.35pt;">
      					3.    Miller’s Ark carries Public Liability Insurance of £10,000,000 with the NFU and works in close contact with vets and Animal Health officers.</p>
      			</td>
      		</tr>
      		<tr>
      			<td style="vertical-align: top; ">
      				<p>
      					The risk of infectious micro organisms as detailed by HSE:</p>
      				<p>
      					 </p>
      				<p>
      					Particularly</p>
      				<p>
      					Zoonotic diseases</p>
      				<p>
      					E Coli 0157</p>
      				<p>
      					Cryptosporidium parvum and Salmonella.</p>
      				<p>
      					 </p>
      			</td>
      			<td style="vertical-align: top; ">
      				<p>
      					Any member of the public, particularly children and staff.</p>
      			</td>
      			<td style="width:652px;">
      				<p>
      					<strong>Livestock management procedure:</strong></p>
      				<ol>
      					<li>
      						All animals chosen for the mobile visit are clean and tidy and assessed regularly as part of management procedure for stress and other issues that may affect their behaviour or suitability for the travelling farm.(Such as illness, pregnancy, just given birth, lameness dullness, etc.)  Local vets and Animal Health Officers are in regular contact and visit the home farm.</li>
      				</ol>
      				<strong>Provision of hand washing:                                      </strong>
      				<ol start="2" style="">
      					<li>
      						Hand washing with running water and soap is available at nearly all mobile locations and our pre booking letter and our handlers advise immediate and thorough hand washing. In addition we can bring hand washing stations and alcoholic gel which inhibits the action of micro organisms. These are backed up by signs with clear instruction and staff supervision and monitoring of hand washing.</li>
      				</ol>
      				<p>
      					<strong>Farm Layout:</strong></p>
      				<ol start="3" style="">
      					<li>
      						At large public shows, the layout of the pens is carefully planned to identify risk, define specific areas and minimise infection. We have a boundary fence and a single entrance and exit to the farm area. This means that the through flow of public takes place between</li>
      				</ol>
      				<p style="margin-left:36.0pt;">
      					a) the entrance where they are warned of the risks of animal contact and their responsibility to hand wash thoroughly and</p>
      				<p style="margin-left:36.0pt;">
      					b) the exit where they are made to leave by hand wash stations, where signage and members of staff actively encourage them to wash hands.</p>
      				<p style="margin-left:36.0pt;">
      					A foot mat/brush and bucket of disinfectant is provided where requested for the removal of any faecal matter trapped on footwear after the visit.</p>
      				<p style="margin-left:36.0pt;">
      					At private events, we consider location carefully before set up and give an HSE talk on responsibilities and risks before any handling commences.</p>
      				<p>
      					<strong>Training and Supervision/Provision of information and signage:</strong></p>
      				<ol start="4" style="">
      					<li>
      						Eating, drinking, smoking and children putting fingers in mouths are all discouraged in the farm area and staff are trained to watch out for these things. Signs are displayed asking the public to refrain from these practices, advising them of their responsibility and informing them of risks, especially where young children are concerned. Trained staff also actively encourage good hand washing practice.</li>
      				</ol>
      				<p>
      					<strong>Management of manure risk</strong></p>
      				<ol start="5" style="">
      					<li>
      						Animals are transported in pressure washed disinfected trailers to the ‘clean’ site to minimise infection risk. Trailers and penning are cleaned after each mobile visit.</li>
      				</ol>
      				<ol start="6" style="">
      					<li>
      						Faeces are carefully and thoroughly collected into bags throughout the visit to ensure the site stays ‘clean’ and the bags are taken away after the event.</li>
      				</ol>
      				<p>
      					<strong>Training and Supervision</strong></p>
      				<ol start="7" style="">
      					<li>
      						All staff are fully trained and instructed about the human health risks associated with animals and the necessary control measures. They understand the need to communicate with the public and supervise at all times. They are trained in the recommendations of the Griffin report, the HSE document ‘Preventing and controlling ill health from animal contact at visitor attractions’ and the joint DEFRA/DH/HPA leaflet on ‘Avoiding infection on farm visits’.</li>
      				</ol>
      			</td>
      		</tr>
      	</tbody>
      </table>
