    html: |
      <p>
      	The Mobile Farm concept embraces the desire to bring children and adults into close contact with farm animals, thus inspiring interest and respect, whilst providing an exciting experience in the security of their own environment.</p>
      <div>
      	 </div>
      <div style="text-align: center; ">
      	<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Mobile farm banner.jpg" style="width: 700px; height: 260px; " /></div>
      <div>
      	 </div>
      <div>
      	We bring everything we need except water, and clean up thoroughly on our departure.</div>
      <div>
      	 </div>
      <div>
      	The Mobile Farm can include sheep and lambs, goats and kids, piglets, miniature donkeys and ponies, rare breed poultry, ducks and geese, hen and chicks, giant rabbits, guinea pigs and a farm dog. The emphasis is on touching and feeding the animals to build confidence and awareness. The welfare of the animals is paramount throughout and only those happy with a lot of attention are used.</div>
      <div>
      	 </div>
      <div>
      	Animal Activity Licence: 19/00315/AWAAL. </div>
      <div>
      	 </div>
