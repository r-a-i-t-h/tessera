      - type: text
        html: |
          <p>
          	The Ingall flock of Oxford Downs was established in 1992 when there was a flock dispersal in Oxfordshire and Elizabeth drove home with twenty Oxford Downs. Some of the oldest blood lines were present in this flock and these big dignified sheep have been a pleasure to own and breed. At one time a home bred ram was champion sheep at Stoneleigh Rare Breeds show and our present ram is from Long Friday stock.</p>
          <p>
          	<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/img  052.jpg" style="width: 700px; height: 148px; " /></p>
          <div>
          	We also breed Devon and Cornwall Longwool sheep, Grey Face Dartmoors, Shetlands and Herdwicks, with Portlands, black Leicester Longwools and Kerry Hills part of the overall flock.</div>
