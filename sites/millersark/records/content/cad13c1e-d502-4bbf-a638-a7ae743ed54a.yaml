      <p>
      	<strong>Testimonials received so far in 2017</strong></p>
      <p>
      	 </p>
      <p>
      	<strong><span style="color:#0000ff;">Eastleigh Medieval Festival</span></strong></p>
      <p>
      	<span style="color:#0000ff;">Really happy with everything, the Miller's Ark handlers were really friendly – Thanks Guys!</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Sebastian Action Trust</strong></p>
      <p>
      	Excellent</p>
      <p>
      	We have used Miller’s Ark Animals for many events over the years.  The Miller's Ark handler was fantastic on the day, very engaged with the children and everyone loved the animals.</p>
      <p>
      	 </p>
      <p>
      	<strong><span style="color:#0000ff;">Woking Children’s Centre</span></strong></p>
      <p>
      	<span style="color:#0000ff;">Excellent</span></p>
      <p>
      	<span style="color:#0000ff;">Aidan was enthusiastic and knowledgeable</span><span style="color: rgb(0, 0, 255);">.  BIG thank you</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Cross Way House Care Home</strong></p>
      <p>
      	Excellent</p>
      <p>
      	Your ‘farmer’ was amazing.  So were the animals such a great experience for the residents.</p>
      <p>
      	 </p>
      <p>
      	<strong><span style="color:#0000ff;">Jellybeans Pre-School</span></strong></p>
      <p>
      	<span style="color:#0000ff;">Excellent</span></p>
      <p>
      	<span style="color:#0000ff;">Fantastic day -  will definitely rebook for next year.  Thank you so much.  </span><span style="color: rgb(0, 0, 255);">Staff and children really enjoyed it.</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Pre School in Hampshire</strong></p>
      <p>
      	Excellent attraction for our fete.  Impressed with hygiene facilities and animals management/welfare. </p>
      <p>
      	Thank you</p>
      <p>
      	 </p>
      <p>
      	<span style="color:#0000ff;"><strong>School in Merstham</strong></span></p>
      <p>
      	<span style="color:#0000ff;">Excellent</span></p>
      <p>
      	<span style="color:#0000ff;">Fantastic, just right for age group.  Very helpful and friendly staff.  Thanks – you’re brilliant!</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Nursery in Andover</strong></p>
      <p>
      	Thank you for bringing your mobile farm to us in May.  The children were very excited about seeing the animals and enjoyed finding out about them-even the adults learnt something new.  </p>
      <p>
      	Many thanks from the teachers and pupils.</p>
      <p>
      	 </p>
      <p>
      	<span style="color:#0000ff;"><strong>Whitegrove Primary School </strong></span></p>
      <p>
      	<span style="color:#0000ff;">Lovely experience = happy children.  ‘Farmers’ were very organised but flexible.</span></p>
      <p>
      	<span style="color:#0000ff;">Thank you.</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Daneshill Prep School </strong></p>
      <p>
      	I’ve done this trip over 6 years.  It is the most valuable educational and exciting event for 4 year olds.  Remember this is always new for them as it should be for us. </p>
      <p>
      	Well done.</p>
      <p>
      	 </p>
      <p>
      	<span style="color:#0000ff;"><strong>Medstead Pre School </strong></span></p>
      <p>
      	<span style="color:#0000ff;">Lovely experience for all children, lovely animals and well run.</span></p>
      <p>
      	<span style="color:#0000ff;">Thank you.</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Bitterne Park Primary School</strong></p>
      <p>
      	Fantastic day.  Kids thoroughly enjoyed it. </p>
      <p>
      	Thank you so much.</p>
      <p>
      	 </p>
      <p>
      	<span style="color:#0000ff;"><strong>Brendoncare Alton</strong></span></p>
      <p>
      	<span style="color:#0000ff;">Emily was wonderful, she interacted with the residents – and nothing was too much for her.  A great time was had by all.</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Christ Church (New Malden) Primary School</strong></p>
      <p>
      	Emily had an excellent manner with the children – very hands on approach and encouraging with the less confident children. </p>
      <p>
      	Good selection of animals – would have again and recommend. </p>
      <p>
      	Thank you.</p>
      <p>
      	 </p>
      <p>
      	<span style="color:#0000ff;"><strong>Elvetham Heath Primary School</strong></span></p>
      <p>
      	<span style="color:#0000ff;">Aidan was fabulous with the children completely pitched at the correct level. </span></p>
      <p>
      	<span style="color:#0000ff;">Thank you.</span></p>
      <p>
      	 </p>
      <p>
      	<strong>Feltonfleet School </strong></p>
      <p>
      	Highly recommended – will use again next year. </p>
      <p>
      	Thanks</p>
