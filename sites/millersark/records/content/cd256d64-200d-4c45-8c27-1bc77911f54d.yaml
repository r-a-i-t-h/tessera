      <p>
      	Tickets cost £15 (£16 on Christmas Eve) for everyone aged 2 years and older and MUST be booked in advance. Wear warm clothes and shoes. Your name will be ticked off at the gate on your arrival. Please do not arrive early to Nativities.</p>
      <p>
      	PLEASE NOTE TICKETS ARE NON REFUNDABLE/NON TRANSFERABLE. THE EVENT WILL GO AHEAD WHATEVER THE WEATHER! </p>
      <p>
      	TICKETS CAN BE BOOKED VIA PAYPAL or BACS*.</p>
      <ol>
      	<li>
      		Log onto your paypal account.</li>
      	<li>
      		Select "send money" tab.</li>
      	<li>
      		To: <a href="mailto:elizabeth@millersark.co.uk">elizabeth@millersark.co.uk</a></li>
      	<li>
      		Amount (£15, x no. of tickets required, £16 on Christmas Eve).</li>
      	<li>
      		Purchases tab select services.</li>
      	<li>
      		Click continue.</li>
      	<li>
      		Next page subject LIVING NATIVITY.</li>
      	<li>
      		Message box please enter the date you would like to come, how many tickets and your name.</li>
      	<li>
      		Finally press "send money".</li>
      </ol>
      <p>
      	We automatically get confirmation of your purchase, and put you on our list to be checked in at the event. Please note we do not issue tickets for this event.</p>
      <p>
      	* For payment by BACS please contact us for the correct bank details.</p>
