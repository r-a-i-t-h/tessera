      <div style="padding: 20px; background-color: rgb(17, 119, 68);">
      	<h1 style="text-align: center;">
      		<strong><font color="#ff0000">CAROLS IN THE BARN</font></strong></h1>
      	<p style="color: rgb(255, 255, 255); text-align: center;">
      		 </p>
      	<p style="color: rgb(255, 255, 255); text-align: center;">
      		      SATURDAY 21st  DECEMBER  at 11am    <span style="color:#ff0000;">SOLD OUT  </span></p>
      	<span _fck_bookmark="1" style="display: none;"> </span>
      	<p style="color: rgb(255, 255, 255); text-align: center;">
      		   SATURDAY 21st DECEMBER  at 2.30pm <span style="color: rgb(255, 0, 0);"><strong>  SOLD OUT</strong></span></p>
      	<p style="color: rgb(255, 255, 255); text-align: center;">
      		   SUNDAY 22nd DECEMBER at 2.30pm       <span style="color:#ff0000;">SOLD OUT</span></p>
      	<p style="text-align: center;">
      		<font color="#ffffff">    MONDAY 23rd  DECEMBER at 11am</font><strong style=""><span style="color: rgb(255, 0, 0);">   </span><font color="#ffffe0"> LAST FEW TICKETS</font></strong></p>
      	<p style="color: rgb(255, 255, 255); text-align: center;">
      		 </p>
      	<p style="color: rgb(255, 255, 255);">
      		<span style="font-size:22px;"><strong><span style="color:#ff0000;">              </span></strong></span></p>
      	<p style="color: rgb(255, 255, 255);">
      		Tickets to Carols in the Barn cost £8 for everyone aged 2 years and over.</p>
      	<p style="color: rgb(255, 255, 255);">
      		 </p>
      	<p>
      		<span style="color: rgb(255, 255, 255);">At Carols in the Barn you will be welcomed with a complimentary mince pie and the chance to buy our piping hot drinks and warming Winter punch! Mingle with friends in the beautiful Tea Barn, before heading through to the Straw Barn to enjoy the Carols.</span></p>
      	<p style="text-align: center; color: rgb(255, 255, 255);">
      		<img alt="Carols in the barn" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Xmas/carols website 2013/carols-in-the-barn.jpg" style="border-width: 4px; border-style: solid; margin: 4px; width: 400px; height: 400px;" /></p>
      	<p style="color: rgb(255, 255, 255);">
      		Geoff and his band will be leading us in traditional Christmas Carols and all the children's favourites. Join in with the popular "JINGLE BELLS", appreciate beautiful SILENT NIGHT" and of course our own "Mickey" the donkey will be making his annual appearance as "Rudolph". Santa may even make an appearance, waving to all during "SANTA CLAUS IS COMING TO TOWN!"<br />
      		 </p>
      	<p style="text-align: center; color: rgb(255, 255, 255);">
      		<img alt="Geoff and the band" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/2016.jpg" style="border-width: 4px; border-style: solid; margin: 4px; width: 300px; height: 300px;" /></p>
      </div>
      <p>
      	 </p>
      <div style="background-color: #fed; overflow: hidden; font-size: 20px; text-align: center; line-height: 1.4em; border-radius: 20px; border: dashed 2px red; margin: 20px 0px; padding: 10px;">
      	<a href="https://www.millersark.co.uk/boxoffice.aspx"><img alt="Book now" border="0" height="56" src="https://www.ticketsource.co.uk/images/bookNow/bookNow-black-small.png" style="float:left; margin: 12px 20px 0px 0px;" width="130" /></a> <a href="https://www.millersark.co.uk/boxoffice.aspx"><img src="https://www.millersark.co.uk/Web/Site/MillersArk/images/holly.gif" style="width: 100px; float: right; margin: 0px 0px 0px 20px;" /></a> <a href="https://www.millersark.co.uk/boxoffice.aspx" style="display: block; padding-top: 10px; text-decoration: none; color: red;"> Click here to book your place at our<br />
      	Carols in the Barn. </a></div>
      <p>
      	Due to the nature of this event, pushchairs, buggies and baby seats cannot be taken in the barn. There will be an undercover buggy park available just outside the barn.</p>
      <p>
      	OUR FESTIVE SAUSAGES can be purchased in advance and collected after all these events.</p>
      <p>
      	<strong><span style="color: rgb(255, 0, 0);">PLEASE NOTE TICKETS ARE NON REFUNDABLE/ NON TRANSFERABLE. ALL EVENTS WILL GO AHEAD WHATEVER THE WEATHER!</span></strong></p>
