      - type: text
        html: |
          <p>
          	Established in 1994 with three black and white foundation cows and the dun and white bull Mochrum Perry from the late Flora Stuart's outstanding herd, Belties, as they are affectionately known, have become a integral part of farm life. After using Perry's progeny on various bloodlines, Elizabeth bought the black and white bull Cherokee in 2011 and his excellent background is an asset to the herd. Cherokee is available at stud and Belted Galloway youngstock are available for sale. Steers go to a local farm shop outlet, but are also occasionally for sale.</p>
