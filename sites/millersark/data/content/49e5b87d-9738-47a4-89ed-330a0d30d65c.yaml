      <p>
      	 </p>
      <p>
      	<strong><span style="font-size:18px;"><span style="font-family: 'comic sans ms', cursive;"><a href="https://www.millersark.co.uk/onfarm/redletter.aspx"><span style="color:#ff0000;">Red Letter Day</span></a></span><span style="font-family: 'comic sans ms', cursive;"> </span><span style="font-family: 'comic sans ms', cursive; color: rgb(0, 128, 0);">experience for adults over 16 years old.</span></span></strong></p>
      <p style="text-align: justify;">
      	<span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;"><span style="color: rgb(0, 128, 0);"><span>Red Letter Days at Miller's Ark guarantee a unique up close experience of farming life. Go behind the scenes of a Rare Breeds farm and experience all aspects of daily farm life by joining the team for the day. Your Red Letter Day will include lots of animal interaction, grooming and feeding, making the animal pens clean and comfy, checking animals in fields and learning about them. </span></span></span></span><span style="color: rgb(0, 128, 0); font-family: "><span style="font-family:comic sans ms,cursive;"><span style="font-size:16px;">We offer two options, a half day or full day experience.</span></span></span></p>
