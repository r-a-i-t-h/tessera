      				<span style="color:#008000;"><span style="font-family: 'comic sans ms', cursive; font-size: 16px;">How do I book?</span></span></td>
      			<td>
      				<span style="color: rgb(0, 0, 255); font-family: 'comic sans ms', cursive; font-size: 16px;">Contact the office and let us know your name and the child's, your personal message, and the email address.</span></td>
      		</tr>
