      <p style="text-align: justify;">
      	<span style="font-size:20px;"><span style="color: rgb(0, 0, 205);"><span style="font-family: comic sans ms,cursive;">Are you stuck for ideas on what to get a friend or family member for Christmas? Whatever their age if they like the outdoor life, w</span>e <span style="font-family: comic sans ms,cursive;">have just the perfect gift voucher for you and your loved ones!</span></span></span></p>
      <p style="text-align: justify;">
      	<span style="font-size:18px;"><strong><span style="font-family: comic sans ms,cursive;"><a href="https://www.millersark.co.uk/onfarm/farmer.aspx"><span style="color: rgb(255, 0, 0);">Farmer 4 a Day</span></a><font color="#008000"> experience for children age 5-15 years old.</font></span></strong></span></p>
      <p style="text-align: justify;">
      	<span style="font-family: comic sans ms,cursive;"><span style="font-size: 16px;"><font color="#008000"><span style="background-color:#e6e6fa;">Children participate in all aspects of a farming day, from mucking out pens to collecting eggs and grooming the ponies. The experience is 11-3pm. We encourage parents to arrive 15 minutes before the end, so children can proudly show off what they have been doing.</span></font><font color="#ff0000"><span style="background-color:#e6e6fa;"> </span></font><span style="color:#008000;"><span style="background-color:#e6e6fa;">Your gift can be personalised with the child's name and who it is from.</span></span></span></span><span style="color:#008000;"><span comic="" sans=""><span style="background-color:#e6e6fa;"> </span></span></span></p>
      <p>
      	<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Farmer 4 a Day/cert-example-farmer4aday.jpg" style="width: 140px; float: right; margin: 30px 10px; transform: rotate(4deg); box-shadow: rgb(153, 153, 153) 5px 5px 10px; height: 198px;" /></p>
