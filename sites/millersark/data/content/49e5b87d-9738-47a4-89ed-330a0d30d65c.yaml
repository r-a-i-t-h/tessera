      				<span style="font-family: 'comic sans ms', cursive; font-size: 16px; color: rgb(0, 0, 255);"><span comic="" sans="">£85 </span></span><span style="font-family: 'comic sans ms', cursive; font-size: 16px; color: rgb(255, 0, 0);"><span comic="" sans="">Full</span></span><span comic="" sans="" style="font-family: 'comic sans ms', cursive; font-size: 16px; color: rgb(255, 0, 0);"> Day Red Letter </span><span style="color:#ff0000;"><span comic="" sans="" style="font-family: 'comic sans ms', cursive; font-size: 16px;">experience </span></span><span style="font-family: 'comic sans ms', cursive; font-size: 16px; color: rgb(0, 0, 255);"><span comic="" sans=""> from 10.30am - 5.30pm including lunch.</span></span></td>
