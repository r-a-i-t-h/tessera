          <div style="text-align: center;">
          	<span style="font-family:arial,helvetica,sans-serif;"><span style="color:#0000cd;"><span style="font-size:14px;"><a href="http://millersark.co.uk/onfarm/parties.aspx" style="text-align: justify; font-size: 14px;">Birthday Parties</a></span></span><span style="color:#0000cd;"><span style="font-size:14px;"><span style="text-align: justify;"> for all ages and Farm Experience Days for adults, families and children can be booked on the farm, so don't miss your chance to book a special day out with us this year.</span></span></span></span></div>
