          <p>
          	We breed Aylesbury Runner, Muscovy and Saxony ducks. Specialise in Polish, Brahma, Pekin and Barbu D'Uccle chicken - bantams and large fowl. We also breed Norfolk Black turkeys, Bourbon Reds and Lavenders. Our geese are Embden type,and we regularly have goslings, ducklings and chicks available for sale.</p>
