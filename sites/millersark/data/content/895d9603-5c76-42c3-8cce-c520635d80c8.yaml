    html: |
      <p>
      	<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/animal-touch/animaltouch P1010127(small).jpg" style="width: 162px; height: 220px; float: right; margin-left: 10px; margin-right: 10px;" /></p>
      <div>
      	We are delighted to offer Animal Touch the use of the farm and our animals. The idea for the charity Animal Touch was born when visiting residential homes with the mobile farm revealed a need for a designated service to special needs users offering them individual or group time with our animals at the farm.</div>
      <div>
      	 </div>
      <p>
      	<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/animal-touch/P1010144(small).jpg" style="width: 161px; height: 220px; float: left; margin-left: 10px; margin-right: 10px;" /></p>
      <div>
      	Anyone is welcome to book a session or attend an open day, (not only those with special needs), as interacting with our animals can be a therapeutic experience for everyone.</div>
      <div>
      	<span style="font-size:16px;">All our lives bring moments where some peace and quiet and times with animals can refresh or soothe.</span></div>
      <div>
      	Educating young people about the benefits of this interaction is vital for the future, so that they protect and respect the gift animals bring to us all.</div>
      <div>
      	 </div>
      <div>
      	Testimonials: </div>
      <div>
      	Very professional and caring interacted with customers and staff, approachable and knowledeable about the animals. Very enjoyable afternoon. Day Centre Autumn 2018.</div>
      <div>
      	A great experience for the children, really helpful handlers. Special School May 2017. </div>
      <div>
      	 </div>
      <div style="text-align: center;">
      	<span style="font-size:18px;">For more detailed information, see <a href="http://www.animaltouch.org">www.animaltouch.org</a></span></div>
      <div>
      	 </div>
