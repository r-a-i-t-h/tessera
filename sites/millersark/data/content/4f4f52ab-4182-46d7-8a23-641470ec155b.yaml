      <div style="background-color: #0260fe; color: #ff0; padding: 20px;">
      	<h1 style="font-weight: bold; color: #ff0;">
      		Schools</h1>
      	<p>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">No coach fees, no insurance worries and the opportunity to include several classes in one day's booking - all these advantages and the fact that the Mobile Farm visit can be easily and usefully integrated into national curriculum work, have made Miller's Ark Animals a very popular choice for schools, nurseries and play-schemes. </span></span></p>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Local press coverage of our visit helps promote your school or nursery.</span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">The Mobile Farm can include sheep and lambs, goats and kids, a calf, piglets, poultry and sometimes a miniature horse or donkey. The emphasis is on touching and feeding the animals to build confidence and awareness. The welfare of the animals is paramount throughout and only those happy with lots of attention are used.</span></span></div>
      	<div>
      		 </div>
      	<div>
      		TESTIMONIALS:</div>
      	<div>
      		<span style="font-size:14px;">Primary School November 2019: Handler was amazing, so friendly and brilliant with both the staff and children. The best visit we have had. </span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Primary Schol June 2019: The children and staff had a fantastic day with the farm. What a wonderful handson experience that our children will never forget. Thank you. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">School June 2019: Previous booking, fantastic workshop filled with interesting information. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Infant School June 2019: This was our 2nd visit, the handler was informative, enthusiastic and communicated well with the children. Good communication about Health and Safety . </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Infant/Nursery May 2019: Recommendation, very informative, great with the nervous children encouraging them to take part... will book again. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">School Trust: Word of mouth recommendation, we loved the warm and friendly approach from the initial</span></span><span style="font-family:comic sans ms,cursive;"> phone call to the handler on the day. </span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Infant School April 2019: Used many times, very informative sessions, delivered in a fun and educationalway for the children. A super day enjoyed by children and staff thank you.</span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Infant School April 2019: Handler was wonderful with both the staff and children. What can I say the visit was amazing, we had a wonderful day. The site was left spotlessly clean after the visit. Thank you. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;"><span comic="" font-size:="" sans="">Primary School March 2019: Handler was fantastic with the children, and informative. Pitching it well for our Early Years children. Would definately recommend. </span></span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;"><span comic="" font-size:="" sans="">Prep School March 2019: Thank you for such an exciting and informative experience. It was lovely to see the delight on the childrens faces and they definately learned lots too. </span></span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;"><span comic="" font-size:="" sans="">Infant School June 2018: A fabulous day. The children loved meeting and touching the animals. Your handler worked very hard and communicated really well with the children.</span></span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Primary June 2018: Such a great day, the handler was great with the children and took time talking to staff at lunchtime. A really graet opportunity for our children. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Primary May 2018: Handler was a massive hit, very informative and the smaller groups enabled all children to have time with the animals. A fabulous day thank you. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;"><span comic="" font-size:="" sans="">Primary April 2018: The children really enjoyed the time with the animals, we have had some brilliant writing from them following your visit. Handler was brilliant.</span></span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Primary School April 2018: Previous visits, very positive handler was informative. Excellent hands on experience and all the children got to hold and toch the animals too. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Pre School April 2018:  Staff, children and parents all LOVED IT thank you!   </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">Primary School March 2018: Such a wonderful experience, so effortless on the chool's behalf, very efficient set up and clear up. Impeccably patient and well behaved animals. </span></span></div>
      	<div>
      		 </div>
      	<div>
      		<span style="font-size:14px;"><span style="font-family:comic sans ms,cursive;">School February 2018: Thank you very much for facilitating such a wonderful visit from your farm animals.  The children (and staff) had a truly wonderful day.  The animals were set up in their pens swiftly and on time and cleared away brilliantly at the end of the visit. We were very impressed with Emily and Sophie - their warm and friendly nature made the children feel instantly at ease with the animals. They also enabled all of the children to stroke as many of the animals as possible in each of the time slots, adapting their approach to the differing needs of the individual children.<br style="font-family: Calibri, sans-serif; font-size: 14px;" />
      		The animals were very well behaved and delighted the children with their sounds as well.  It was a wonderful sensory rich experience for our students and one that we will all remember fondly.<br style="font-family: Calibri, sans-serif; font-size: 14px;" />
      		I would definitely be keen to book you again and will recommend to other schools.</span></span><br style="font-family: Calibri, sans-serif; font-size: 14px;" />
      		 </div>
