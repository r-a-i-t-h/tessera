      <div style="padding: 20px; background-color: #0260fe; color: #ff0;">
      	<h1 style="font-weight: bold; color: #ff0;">
      		Fetes, Shows and Events</h1>
      	<p>
      		An integral part of this "Show within your Show" is the programme of very popular demonstrations which take place regularly throughout the day and usually includes:</p>
      	<ul>
      		<li>
      			Pygmy goat cuddles</li>
      		<li>
      			Donkey Grooming</li>
      		<li>
      			Chick and Duckling Handling</li>
      		<li>
      			Piglets Bath-Time</li>
      	</ul>
      	<p>
      		       <img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Shows 1.jpg" style="text-align: center; width: 550px; height: 413px; margin: 2px; border-width: 2px; border-style: solid;" /></p>
      	<p>
      		All these demonstrations are carried out by experienced farming people, who share their experiences and anecdotes with your show goers and place great emphasis on involving the public hands-on throughout.</p>
      	<p>
      		       <img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Shows 2.jpg" style="text-align: center; width: 550px; height: 413px; border-width: 2px; border-style: solid; margin: 2px;" /></p>
      	<p>
      		All shows need a barrier fence around the farm provided by the show organisers for Health and Safety reasons with a clear entrance and exit. We bring hand wash units, anti bacterial soap and hand towels with us. </p>
      	<p>
      		Large shows also need to provide 30 bales of straw for animal handling sessions and our popular goat mountain.</p>
      	<p>
      		The welfare of our animals is paramount to us, and as a result we are delighted to have been issued our</p>
      	<p>
      		Animal Activity Licence number: 19/00315/AWAAL.</p>
      	<p>
      		TESTIMONIALS:</p>
      	<p>
      		C<strong>hurch</strong>: As always handler was brilliant, it is great to see the same face again, set up was fantastic all the children loved the animals. A truly excellent service. We so appreciate all you do. </p>
      	<p>
      		<strong>Guide Unit</strong>: All ages loved your visit, great experience would recommend. </p>
      	<p>
      		HMP.......August 2019: Exceptional day, families, staff, men and animals all very happy and well behaved. Handler was AMAZING thank you. </p>
      	<p>
      		Gosport event June 2019: The staff were proffesional and friendly throughout the weekend, excellent variety of animals and hand wash facilities. </p>
      	<p>
      		London event September 2018: Use Miller's Ark every year, extremly friendly handler and interacted well with everyone. Great control over the animals and cleared up well after the event. A great crowd pleaser. Thank you. </p>
      	<p>
      		London Agricultural Show September 2017: Amazing service as always, staff very approachable for the public and answer childrens questions knowledgeably. Animals happy and cared for thank you so much. </p>
      	<p>
      		EM Festival May 2017: Really happy with everything the staff were really friendly -Thanks guys.</p>
      	<p>
      		HW Carnival June 2017: A good team and most enjoyable time had by all. </p>
      	<p>
      		Corporate London June 2017:Thank you for bringing such lovely animals and staff again to our summer party. We cannot recommend you highly enough. </p>
      </div>
