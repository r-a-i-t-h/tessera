      <div style="padding: 20px; color: rgb(255, 255, 0); background-color: rgb(0, 96, 255);">
      	<p>
      		Make your child's birthday extra special by hosting a party at Manor Farm.  Or we can visit your home.........</p>
      	<p>
      		Party times usually run from 10.30 - 12.30 or 14.00 - 16.00 with time for eating the birthday fare included in the last half hour. After school parties can also be arranged and parties during the week for younger non school age children.</p>
      	<p>
      		Animal activities will be run by two personal party guides who will be on hand in our cosy traditional Tea Barn to greet guests 15 minutes before the start time.</p>
      	<p>
      		Activities include cuddling lambs, tickling pigs tummies, playing with goat kids, grooming donkeys and ponies, handling of small animals like rabbits, guinea pigs, chicks and ducklings and bottle feeding the lambs and goat kids depending on the time of year.</p>
      	<p>
      		Parties will have use of our indoor straw play area, and a train ride on Looby Loo - our land train - can be arranged by appointment for an extra fee.</p>
      	<p>
      		We have free parking and good handwashing facilities.</p>
      </div>
