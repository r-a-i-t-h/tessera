      <p>
      	Make your child's birthday extra special by hosting a party at Manor Farm.</p>
      <p>
      	Party times usually run from 10.30 - 12.30 or 14.00 - 16.00 with time for eating the birthday fare included in the last half hour. After school parties can also be arranged and parties during the week for younger non school age children.</p>
      <p>
      	Animal activities will be run by your own personal party guide who will be on hand in our cosy traditional Tea Barn to greet guests 15 minutes before the start time.</p>
      <p>
      	Activities include cuddling lambs, tickling pigs tummies, playing with goat kids, grooming donkeys and ponies, handling of small animals like rabbits, guinea pigs, chicks and ducklings and bottle feeding the lambs and goat kids depending on the time of year.</p>
      <p>
      	Parties will have use of our indoor straw play area. Looby Loo - our popular land train - can be booked for an extra fee of £30.</p>
      <p>
      	We have free parking and good handwashing facilities.</p>
      <p>
      	Testimonials: </p>
      <p>
      	 June 2018: Your host was great with our group of children, all enjoyed their day- we look forward to a return day  </p>
      <p>
      	April: We have been coming for years! Lisa has been an excellent host our daughter had a great time. </p>
