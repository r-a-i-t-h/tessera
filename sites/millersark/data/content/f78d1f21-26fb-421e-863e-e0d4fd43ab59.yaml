      - type: text
        html: |
          <p>
          	In 2005 Elizabeth met four little donkeys at Lady Fisher's estate in Sussex and founded the original Swanthorpe herd comprising of a jack and three jennies.  From these came our delightful gang of miniature donkeys with a black and dark sorrel jack producing a range of colours on further miniature donkeys imported from Circle C ranch in Canada and Marshlyn Reid's herd in America. Miniature donkeys now form an essential part of our mobile farm and bring great character and fun to the farmyard. Weaned youngsters are usually for sale and our dark sorrel and coloured jacks are at stud for visiting ladies! All miniatures are pedigree and registered with the Miniature Mediterranen Donkey Association.</p>
