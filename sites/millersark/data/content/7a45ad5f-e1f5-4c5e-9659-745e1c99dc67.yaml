      <div>
      	'We were absolutely delighted with the animals and staff you brought to Tate Britain. It was an incredible transformation for the gallery. It was amazing seeing goats roaming the gallery grounds and hearing turkeys gobbling outside office windows.’</div>
      <div>
      	<strong>Tate Britain</strong></div>
      <div>
      	July 2006</div>
      <div>
      	 </div>
      <div>
      	‘Many thanks for yet another fantastic visit to our home today. Residents and staff thoroughly enjoyed themselves. The animals were delightful; they are all so interesting and approachable.’</div>
      <div>
      	<strong>The Royal Star & Garter Home</strong></div>
      <div>
      	January 07</div>
      <div>
      	 </div>
      <div>
      	‘We had never before come across an organisation that provided a farm of animals for the benefit of schools. It was a pleasure to see the animals and children’s reaction to them.'</div>
      <div>
      	<strong>St Anthony’s School</strong></div>
      <div>
      	May 2006</div>
