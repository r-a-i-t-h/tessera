      <div image="" millersark="" res="" site="" style="background-position: center 0px; margin: 30px auto; padding: 40px 150px 20px; -ms-transform: rotate(-2deg); background-image: none;" web="">
      	<b>LATEST NEWS : Friday 17th February.</b><br />
      	Three words say it all  " BABIES BABIES BABIES". This week has been no exception with more goat kids born, and still the big Devon and Cornwall ewes keep giving birth to beautiful lambs. 2013 is turning out to be a great season for the girls! 'Trouble' another Pygmy goat has given birth to tiny twin kids and Scarlett the mum who had the ceasarian is doing well.                                     <br />
      	We have a special handling area where children can hold the lambs and kids on their laps. <br />
      	Look at Facebook Miller's Ark to see their pictures and the You tube video link below!<br />
      	<br />
      	Come and see the new lambs and goat kids scampering around their pens...... and don't miss our absolutely gorgeous fluffy white miniature donkey foal 'Nile'. He is just eight days old! </div>
      <p>
      	<strong><span style="color: rgb(0, 0, 204);">There is lots to do besides seeing the lambs, whatever the weather. Children can let off steam in the straw play area or in the mini tractor zone. Donkeys and ponies are waiting for a groom, our cows have calves, naughty goat kids await laps to sit on and Kune Kune pigs are definitely wanting their tummies tickled!</span></strong></p>
      <p>
      	<img alt="New lambs born in January 2013" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/2013/2013-lambs1.jpg" style="border-width: 0px; border-style: solid; width: 700px; height: 320px; margin-top: 8px; margin-bottom: 8px;" /></p>
      <p>
      	<span style="color: rgb(0, 0, 204);">If you enjoy freshly cooked succulent bacon on a soft bap or a piping hot jacket potato filled with melted cheese, sausage or tuna, then come and visit us in The Old Dairy Tea Barn. As an alternative, you can try one of our fabulous 'create your own' beef burgers. Then finish off with a steaming hot chocolate with whipped cream and a slice of scrummy cake. </span></p>
      <p>
      	<span style="color: rgb(0, 0, 204);">Looby Loo (our land train) will be back giving rides throughout the day,weather permitting. All the barns are under cover too.</span></p>
      <p>
      	<span style="color: rgb(0, 0, 204);">So don your wellies and warm clothes and enjoy family time at Manor Farm. We look forward to seeing you. Don't forget to follow us on Facebook (Millers Ark), and be the first to see the photos of the newborn babies.</span></p>
      <p>
      	Entry is £6 for everyone over 2. Children under 2 are free. Apologies but we do not have credit card facilities at this time. Payment is cash,cheque or you can pay via paypal on the day.</p>
