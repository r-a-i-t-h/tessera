      <p>
      	Miller’s Ark Animals Privacy Statement</p>
      <p>
      	Privacy Policy</p>
      <p>
      	If you have any queries or concerns about this privacy policy, you may contact us using the following information:</p>
      <p>
      	Miller’s Ark Animals, Manor Farm, Blackstocks Lane, Hook, RG27 9PH</p>
      <p>
      	Tel: 01256 767596</p>
      <p>
      	E-mail: <a href="mailto:elizabeth@millersark.co.uk">elizabeth@millersark.co.uk</a></p>
      <p>
      	If you wish to make any comments to Miller’s Ark Animals about the website or if you have any questions, please contact us by email <a href="mailto:elizabeth@millersark.co.uk">elizabeth@millersark.co.uk</a> or writing to us at the above address or calling us on the above telephone number.</p>
      <p>
      	Users contacting us via this website or via any of the above mediums offered, do so at their own risk and provide us with any personal details at their own risk. Your personal information is kept private and stored securely in line with the General Data Protection Regulation 2018.</p>
      <p>
      	Please note that you use this website at your own risk. Miller’s Ark Animals have taken the necessary steps to protect the privacy of its user, but they cannot be held responsible for any type of loss or damage you may sustain as a result of accessing our website. This website takes no responsibility for the contents of any other websites to which www.millersark.co.uk includes links to and the inclusion of these links does not imply any endorsement to them on the part of Miller’s Ark Animals. We reserve the right to modify, supplement, move or delete portions of or add to the website at any time with or without notice.</p>
      <p>
      	 </p>
      <p>
      	Ways We Collect Your Information</p>
      <p>
      	We collect your information in the following ways:</p>
      <ul>
      	<li>
      		When you join our mailing list via the website or leaving an email address at an Open Day.</li>
      	<li>
      		When a booking is made (payment details are NOT stored)</li>
      	<li>
      		When you contact us directly to request more information about a service or event that we offer</li>
      	<li>
      		When you communicate with us either by phone, in writing, by email or in person</li>
      </ul>
      <p>
      	Keeping and Managing Your Information</p>
      <p>
      	Safeguarding your personal information is of the utmost importance to us. All personal information is hosted securely in the UK. We can ensure there are appropriate technical controls in place to protect this information. We will ensure that all Miller’s Ark Animals staff with access to your personal data keep it strictly confidential.</p>
      <p>
      	The personal data we usually collect is:</p>
      <ul>
      	<li>
      		Your name</li>
      	<li>
      		Your company name (if given)</li>
      	<li>
      		Your contact details (phone number, email address, address)</li>
      	<li>
      		Details of the inquiry</li>
      </ul>
      <p>
      	We will use your personal data with your consent to provide you with information on our Mobile Farm or Farm events that you have requested such as;</p>
      <ul>
      	<li>
      		Email marketing – including newsletters, special offers, company updates or information on upcoming event information.</li>
      	<li>
      		Direct mail – occasionally we may send brochures or leaflets that may be of interest to you, in accordance with a booking or enquiry you may have made.</li>
      </ul>
      <p>
      	Payment Details</p>
      <p>
      	We would like to remind you that where transactions have been made via debit / credit card, we <strong>DO NOT hold your payment / credit card information with the following exception:</strong></p>
      <p>
      	 </p>
      <p>
      	Sharing with Third Parties</p>
      <p>
      	We will never commercially sell your personal data to anyone else or give it to third parties who may use if for their own purposes.</p>
      <p>
      	Very rarely, we may liaise with third party providers to ensure execution of orders and account administration.  Examples are:</p>
      <ul>
      	<li>
      		Providing shipping information to 3rd party shippers (UPS, DHL etc) for quoting on and delivery of products</li>
      </ul>
      <p>
      	In exceptional circumstances, we may disclose your personal information if required by law or to defend ourselves or others against illegal or harmful activities.</p>
      <p>
      	 </p>
      <p>
      	Your Rights</p>
      <p>
      	The General Data Protection Regulations gives you certain rights, which are listed below:</p>
      <ul>
      	<li>
      		You have a right to be informed when your personal data is being collected, what is collected and how it will be used.</li>
      	<li>
      		You have the right to withdraw consent at any time.</li>
      	<li>
      		You have a right to access your personal data and can request a copy of the information we hold on you. We may need to request specific information to help us confirm your identity and ensure you right to access your personal data. See Personal Details heading for additional information.</li>
      	<li>
      		You have a right in certain circumstances to have inaccurate personal data rectified, blocked, or erased.</li>
      </ul>
      <p>
      	If you chose to request a copy of the information we hold on you, this will be provided free of charge, unless the request is found to be unfounded, excessive or repetitive.</p>
      <p>
      	 </p>
      <p>
      	Email Marketing</p>
      <p>
      	Miller’s Ark Animals would like to provide you with information via email from time to time. If you have previously signed up with us or have asked us for information, we may send you information via email, unless you have asked us not to do so. We will continue to provide you with information via email until you ask us not to, by unsubscribing from our mailing list.</p>
      <p>
      	Email marketing campaigns sent out via Miller’s Ark Animals may contain tracking facilities within the actual email. This means subscriber activity is tracked and stored in a database for future analysis and evaluation. Tracked activity may include; the opening of emails, forwarding of emails, the clicking of links within the email content, times, dates and frequency of activity. The information is used to refine future email campaigns and supply the user with more relevant content.</p>
      <p>
      	In compliance with UK Spam Laws and the Privacy and Electronic Communications Regulations 2003 subscribers are given the opportunity to unsubscribe at any time through an automated system.</p>
      <p>
      	 </p>
      <p>
      	How to Unsubscribe</p>
      <p>
      	In accordance with the recent <strong>General Data Protection Regulation (GDPR)</strong> changes,</p>
      <p>
      	users are free to unsubscribe from our mailing list whenever they choose.</p>
      <p>
      	<strong>This means that all personal information held by </strong><strong>Miller’s Ark Animals will be deleted, and communications will cease.</strong></p>
      <p>
      	If you no longer wish to receive email marketing from the Miller’s Ark Animals, you can opt out at any time either of the following ways;</p>
      <ul>
      	<li>
      		Click the ‘Unsubscribe’ button at the bottom of any Miller’s Ark Animals mail</li>
      	<li>
      		Email <a href="mailto:elizabeth@millersark.co.uk">elizabeth@millersark.co.uk</a> and ask to be removed from database</li>
      </ul>
