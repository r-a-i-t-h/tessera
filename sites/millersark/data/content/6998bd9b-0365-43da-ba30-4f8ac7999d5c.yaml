      - type: text
        html: |
          <p>
          	When foot and mouth struck in 2001 the 'mobile farm' ground to a halt along with all cloven hoofed animal movements and Miller's Ark faced financial ruin. But the government lifted restrictions on poultry and equines moving in the Autumn and Elizabeth went out to buy donkeys, Shetland ponies and poultry to get the farm moving again. A love affair with donkeys began then and the standard herd still has founder members present in Mickey and Jennifer, both ex beach donkeys and part of the family. All standards are well handled and loving and we keep a range of colours to suit every preference. Donkey foals are sold at 6 months or older and are all microchipped, wormed and have a passport. </p>
