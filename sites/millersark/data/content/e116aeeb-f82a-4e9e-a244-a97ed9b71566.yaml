      <div style="border-radius: 0px 15px 0px 0px; padding-top: 220px; padding-bottom: 10px; background-image: url(https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Xmas/2015/elf-parties-header.jpg)">
      	<p style="text-align: center;">
      		 </p>
      	<p style="text-align: center;">
      		<strong><span style="color: rgb(255, 255, 255); font-size: 20px;">Magical Elf Tea Party Saturday 23rd  SOLD OUT</span></strong></p>
      	<p style="text-align: center;">
      		<strong><span style="color: rgb(255, 255, 255); font-size: 20px;">AND Sunday 24th </span><span style="color: rgb(255, 255, 255); font-size: 20px;">November  </span></strong></p>
      	<p style="text-align: center;">
      		<strong><span style="color: rgb(255, 255, 255); font-size: 20px;">4-6pm</span></strong></p>
      	<p style="text-align: center;">
      		<span style="font-size: 20px;"><span style="color: rgb(255, 255, 255);">Enter a World of  Red and Green at  the Elves' Private Tea Party!</span></span></p>
      </div>
      <p style="text-align: center;">
      	 </p>
      <p>
      	Play traditional games with the elves in our cosy barn, like “pin the tail on the donkey”, "sleeping pigs", "musical straw bales" and learn the “special elf dance”! If you would like to dress up as elves, the more elves the merrier!</p>
      <p>
      	A unique magical experience for a few lucky families! The cost of this event is £10 for children over 2, and £5 for children 18 months to 2 years, and includes seasonal sandwiches, “elfie snacks", crisps, cake or cookie and warm drinks, and £7 for adults including a festive finger buffet, luxury hot chocolate good enough to warm Santa on a cold night and Christmas cookies perfect for his reindeer!</p>
      <p>
      	<strong><span style="color:#ff0000;">Booking is essential visit our Box Office page to book tickets for this event. </span></strong></p>
      <p>
      	 </p>
      <p>
      	Remember to bring your camera/phone to this special experience and capture memories that will last a lifetime.<br />
      	 </p>
