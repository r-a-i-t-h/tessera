      <div style="background-color: #0260fe; color: #ff0; padding: 20px;">
      	<h1 style="font-weight: bold; color: #ff0;">
      		Nurseries</h1>
      	<p>
      		We encourage close interaction with all our farm animals to increase confidence, stimulate curiosity and promote respect for living things. Our work with the nursery curriculum covers areas such as:</p>
      	<ul>
      		<li>
      			<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Nursery - Tiny Tate.jpg" style="width: 240px; height: 360px; float: right; margin: 20px 10px; " />Feeling good about yourself and how animals naturally can reassure</li>
      		<li>
      			Making friends with animals-how do we treat them?</li>
      		<li>
      			Writing about the animals</li>
      		<li>
      			Sensory expressions: eg. soft, hard, wet, rough</li>
      		<li>
      			Different types of feet, beaks etc</li>
      		<li>
      			Counting the animals, matching parents and babies</li>
      		<li>
      			Animal role play</li>
      		<li>
      			Art and craft spin offs from the visit</li>
      	</ul>
      	<p style="text-align: center; ">
      		 </p>
      	<p>
      		Our animals will include small and giant chickens, ducks, geese, rabbits and guinea pigs, rare breed sheep and pigs, goats and a miniature donkey or pony. We bring all the penning and equipment and clear up thoroughly on our departure, inside or outside, all we need is access to a water supply.</p>
      	<p>
      		Visits usually run from 10.30 - 2.30pm</p>
      	<p>
      		Miller’s Ark Animals is covered by Public Liability Insurance and a Risk Assessment can be provided</p>
      	<p>
      		TESTIMONIALS:</p>
      	<p>
      		Nursery October 2019: Have booked for several years, the children had a fantastic day and enjoyed the experiences of holding and touching the animals.</p>
      	<p>
      		Toddler Group July 2019: Fabulous day despite the weather, wonderful to see children come out of themselves, when afraid to touch anything but ending up stroking all animals. Will definately book again. </p>
      	<p>
      		Toddler Group May 2019: This was our 3rd visit, handler was wonderful with the children who were mostly under 4. Looking forward to our booking next year. </p>
      	<p>
      		Infant School May 2019: Handler was friendly enabling the children to feel comfortable around the animals and ask questions.</p>
      	<p>
      		Children's Centre April 2019: We have hired the farm several years in a row ....the handler was amazing, interacting brilliantly with the children and their parents, taking time to explain all about the animals thank you.</p>
      	<p>
      		Nursery June 2018: This was our 3rd visit with Miller's Ark farm and this was one of the best! Everyone really enjoyed the educational talk with the "farmer" he was superb with the children and staff. An amazing day thank you! </p>
      	<p>
      		Infant + Nursery School June 2018: Absolutely fantastic day, thank you so much! Very informative and hands on. </p>
      	<p>
      		Pre school June 2018: We love the fact our children can have a lovely farm experience without all the extra organisation. </p>
      	<p>
      		Children's Centre June 2018: Excellent day, brilliant with all our children, ( young, younger and special needs). Thank you.</p>
      	<p>
      		Nursery 30th April 2018: Amazed at how well the animals were when they were in a strange environment inside. The handler was great with the children answering questions and encouraging them to stroke/touch the animals.</p>
      	<p>
      		Pre school 20th May 2017: Excellent interaction, impressed with hygiene facilities and animal management/welfare. Thank you.</p>
      	<p>
      		EM pre school 23rd June 2017: We book every year, the children and staff all thoroughly enjoyed the visit thank you. </p>
      	<p>
      		<img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Nursery footer.jpg" style="width: 660px; height: 389px; " /></p>
      </div>
