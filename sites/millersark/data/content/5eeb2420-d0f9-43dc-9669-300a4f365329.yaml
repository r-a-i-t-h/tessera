  main:
    html: |
      <p>
      	<strong>From Basingstoke</strong> proceed nearly 4 miles East along the A30 and turn right across the dual carriageway into Blackstocks Lane. <u>Turn immediately </u>left into the field car park on Open Days or right up the farm track signed St Swithun's Church and Miller's Ark.<br />
      	<br />
      	<strong> <img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/tractor-03.jpg" style="width: 200px; height: 143px; float: right;" />From Hook</strong>, near junction 5 of the M3, travel West towards Basingstoke. After the Hoggett Pub traffic lights come down the hill, then turn second left into Blackstocks Lane signposted St Swithun's Church. <u>Turn immediately </u>left into field car park on Open Days or right up the farm track signed St Swithun's Church and Miller's Ark.</p>
