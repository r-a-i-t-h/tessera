      <style type="text/css">
      .pagebg {
      		background-image: url(https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Xmas/looby-loo-frosty.jpg);
      		background-position: bottom; 
      		padding: 20px 20px 490px; 
      		color: rgb(0, 0, 102);
      		background-color: rgb(255, 255, 255);
      		background-repeat: no-repeat;
      	}</style>
      <div class="pagebg">
      	<h1 style="text-align: center; color: rgb(0, 0, 204); font-weight: bold;">
      		<span style="font-family:comic sans ms,cursive;"><span style="color: rgb(255, 0, 0);">Santa Special Farm Open Days</span></span></h1>
      	<h4 style="text-align: center;">
      		<span style="font-size:18px;"><span style="color: rgb(0, 128, 0);"><span style="font-family: comic sans ms,cursive;"> </span></span><span style="color: rgb(0, 128, 0);"><span style="font-family: comic sans ms,cursive;">Sunday 8th and Sunday 15th December 10-3pm</span></span></span></h4>
      	<h4>
      		<span style="color: rgb(0, 128, 0);"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;"><img alt="" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Xmas/santa listening to girl.jpg" style="border-width: 2px; border-style: solid; margin: 10px 2px; width: 270px; height: 235px; float: left;" /></span></span></span></h4>
      	<h4>
      		 </h4>
      	<h4>
      		<span style="color: rgb(0, 128, 0);"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;">Santa Special Open Day tickets are available to prebook at £8<font color="#005500"> per person aged 2 and over.</font></span></span></span></h4>
      	<p>
      		<span style="color: rgb(0, 128, 0);"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;"><font color="#005500">There will be an additional charge of £5 per child to visit Santa in his magical grotto and receive an exciting present.</font></span></span></span></p>
      	<h4>
      		<strong><span style="color:#ff0000;"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;">To reserve your place please visit our box office.</span></span></span></strong><span style="color: rgb(0, 128, 0);"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;"> </span></span></span></h4>
      	<h4>
      		<span style="color: rgb(0, 128, 0);"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;">Please give number of adults and children when booking with age and gender of each child visiting Santa.</span></span></span></h4>
      	<p>
      		<span style="color: rgb(0, 128, 0);"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;">Adults are welcome to share this magical experience for free. Pre booking is advised as presents from the North Pole are limited and to ensure that the correct age/gender related present is received. </span></span></span></p>
      	<p>
      		<span style="font-size:16px;"><span style="font-family:comic sans ms,cursive;"><span comic="" sans="" style="color: rgb(0, 128, 0); font-family: ">There will be all the usual farm open day fun including giant straw play and lots of friendly animals to cuddle and groom. Climb in with the pigs and tickle their tummies, cuddle the goats in goat mountain, groom the miniature donkeys and hug the adorable foals, feed the sheep and enjoy watching the children with chicken and guinea pigs on their laps in the handling area.</span></span></span></p>
      	<p>
      		<strong><span style="color: rgb(0, 128, 0);"><span style="font-size: 16px;"><span style="font-family: comic sans ms,cursive;">The Old Dairy Tea Barn will be open serving ciabattas, homemade soup, piping hot jacket potatoes, "seasonal specials" and scrummy cakes, not forgetting our hot drinks and warming blackcurrant for the children. </span></span></span></strong></p>
      	<h4>
      		 </h4>
      </div>
