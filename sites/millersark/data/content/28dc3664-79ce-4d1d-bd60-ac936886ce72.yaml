      <div style="padding: 20px; width: 660px; color: rgb(221, 221, 255); font-size: 1.1em; background-color: rgb(0, 0, 34);">
      	<h1 style="text-align: center; color: rgb(221, 221, 255);">
      		Magical Living Nativity</h1>
      	<p>
      		If you've never been to an original Magical Living Nativity before, then you will not know how special it is. If you've been before, you will want to book again, so here are the details.</p>
      	<p>
      		 </p>
      	<p>
      		Arriving in the dark, you will be welcomed into our warm candle lit Tea Barn to await the arrival of Mary and Joseph on their donkey. Travelling back in time, we will journey with them in search of a room at the inn. During the journey we will meet innkeepers, shepherds with their flocks, angels and wise men. Then at last the baby Jesus is born to the wonder of us all.</p>
      	<p style="text-align: center;">
      		<img alt="Mary and Joseph arriving at the inn" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Xmas/Nativity Mary and Joseph - med.jpg" /></p>
      	<p>
      		Back in the cosy Tea Barn after this truly magical experience, you will be greeted with hot drinks and juice for everyone and "Miller's Ark" own rare breed hot dogs and warm mince pies.</p>
      	<p style="text-align: center;">
      		<img alt="Shepherds at night" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/Xmas/Shepherds at night.jpg" /></p>
      </div>
      <p>
      	 </p>
      <p>
      	We will be holding our popular LIVING NATIVITIES on the following selected days in DECEMBER.</p>
