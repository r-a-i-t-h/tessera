  main:
    html: |-
      <p>
      	<span style="color: rgb(0, 0, 0); font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 15px; ">The risk assessment below is also available as a PDF document which is easier to print:</span></p>
      <p style="margin-top: 0px; color: rgb(0, 0, 0); font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 15px; text-align: center; ">
      	<a href="https://www.millersark.co.uk/Web/Site/MillersArk/Res/File/Documents/Risk assessments/New Manor Farm on farm risk assessment.pdf" style="text-decoration: none; color: rgb(0, 0, 153); " target="_blank"><img alt="Mobile Farm risk assessment in Adobe PDF format" src="https://www.millersark.co.uk/Web/Site/MillersArk/Res/Image/pdf_icon.gif" style="width: 51px; height: 49px; border-width: 0px; border-style: solid; vertical-align: middle; " /></a><a href="https://www.millersark.co.uk/Web/Site/MillersArk/Res/File/Documents/Risk%20assessments/New%20Manor%20Farm%20on%20farm%20risk%20assessment.pdf" style="text-decoration: none; color: rgb(0, 0, 153); " target="_blank">On Farm risk assessment in Adobe PDF format</a> (141kb)</p>
      <p style="margin-top: 0px; color: rgb(0, 0, 0); font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 15px; text-align: center; ">
      	 </p>
      <table border="0" cellpadding="0" cellspacing="0" class="std" style="width: 98%; ">
      	<tbody>
      		<tr>
      			<td style="">
      				<p>
      					<strong>Company Name :  </strong></p>
      			</td>
      			<td style="">
      				<p>
      					Miller’s Ark Animals</p>
      			</td>
      		</tr>
      		<tr>
      			<td style="">
      				<p>
      					<strong>On-site Address :</strong></p>
      			</td>
      			<td style="">
      				<p>
      					Manor Farm<br />
      					Blackstocks Lane<br />
      					Nately Scures<br />
      					Hook<br />
      					RG27 9PH</p>
      			</td>
      		</tr>
      		<tr>
      			<td colspan="2" style="">
      				<p>
      					Miller’s Ark Animals home site at Manor Farm is regularly inspected by Basingstoke and Deane Borough Council and Hampshire County Council for good practice. We have a close link with DEFRA’s Animal Health local office in Winchester and our own vets. High levels of trained staff are always on site.</p>
      			</td>
      		</tr>
      	</tbody>
      </table>
      <p>
      	 </p>
      <table border="1" cellpadding="0" cellspacing="0" class="std" style="width: 98%; ">
      	<tbody>
      		<tr>
      			<th style="">
      				<p>
      					<strong>Significant Hazards</strong></p>
      			</th>
      			<th style="">
      				<p>
      					<strong>Who is at risk</strong></p>
      			</th>
      			<th style="">
      				<p>
      					<strong>     Control Measures</strong></p>
      			</th>
      		</tr>
      		<tr>
      			<td style="width:152px;">
      				<p>
      					Hazards on site including machinery, animals, barbed wire, electric fences</p>
      			</td>
      			<td style="width:175px;">
      				<p>
      					All</p>
      			</td>
      			<td style="width:331px;">
      				<ol>
      					<li>
      						Avoid moving machinery<br />
      						  </li>
      					<li>
      						Do not climb on bales, walls or fences<br />
      						  </li>
      					<li>
      						Do not touch barbed wire or electric fences<br />
      						  </li>
      					<li>
      						Do not touch or feed animals unless the farm personnel are supervising/give permission<br />
      						  </li>
      					<li>
      						Daily visual checks and weekly routine checks are made by senior staff throughout the year.</li>
      				</ol>
      			</td>
      		</tr>
      		<tr>
      			<td style="width:152px;">
      				<p>
      					Slip and trip hazards</p>
      			</td>
      			<td style="width:175px;">
      				<p>
      					All</p>
      			</td>
      			<td style="width:331px;">
      				<ol>
      					<li>
      						Visitors to be made aware of hazards and the care needed around an old farm site.</li>
      				</ol>
      			</td>
      		</tr>
      		<tr>
      			<td style="width:152px;">
      				<p>
      					Being bitten, kicked or knocked over by an animal</p>
      			</td>
      			<td style="width:175px;">
      				<p>
      					All</p>
      			</td>
      			<td style="width:331px;">
      				<ol>
      					<li>
      						Animals  are penned securely<br />
      						  </li>
      					<li>
      						All our animals are used to being handled<br />
      						  </li>
      					<li>
      						It is our intention that no member of the general public is allowed to pick up or touch any animals without a member of staff being present.<br />
      						  </li>
      					<li>
      						We are fully insured with the National Farmers Union and have Public Liability Insurance of £5,000,000</li>
      				</ol>
      			</td>
      		</tr>
      		<tr>
      			<td style="width:152px;">
      				<p>
      					Infection and illness from contact with an animal or unfamiliar farm environment, particularly E Coli.</p>
      			</td>
      			<td style="width:175px;">
      				<p>
      					All</p>
      				<p>
      					 </p>
      			</td>
      			<td style="width:331px;">
      				<ol>
      					<li>
      						Avoid transmission of infection from hand to mouth. Stress to both adults and children the importance of washing hands thoroughly, not putting fingers or thumbs in mouths. For groups this is covered in the welcome Health and Safety talk.<br />
      						  </li>
      					<li>
      						Hand wash stations are available throughout the farm with ‘Wash your hands’ signs and hot and cold water facilities are available in the toilets .<br />
      						  </li>
      					<li>
      						Wash hands thoroughly before eating and eat only in designated areas of the Tea Barn or Picnic Area.<br />
      						  </li>
      					<li>
      						Check, change or clean footwear before leaving site as necessary. <br />
      						  </li>
      					<li>
      						Pregnant women are advised not to go near sheep which have just lambed or new born lambs as a health precaution.<br />
      						  </li>
      					<li>
      						Staff are trained in all matters regarding E Coli transmission and other safety issues.<br />
      						  </li>
      					<li>
      						Approved disinfectants are used on the farm.</li>
      				</ol>
      			</td>
      		</tr>
      		<tr>
      			<td style="width:152px;">
      				<p>
      					Lost Children</p>
      			</td>
      			<td style="width:175px;">
      				<p>
      					 </p>
      			</td>
      			<td style="width:331px;">
      				<ol>
      					<li>
      						We have a team trained to identify lost children and any child found without its parent or teacher will be taken to the farm office to be collected.</li>
      				</ol>
      			</td>
      		</tr>
      	</tbody>
      </table>
      <p>
      	 </p>
      <p>
      	Signed: Elizabeth Miller – Owner of Miller’s Ark Animals        </p>
