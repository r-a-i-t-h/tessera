    html: joy of hex
  main:
    html: "

      \        <style>

      \            #center {

      \                position: absolute;

      \                top: 50%;

      \                left: 50%;

      \                border: solid 1px black;

      \                width: 0px;

      \                height: 0px;

      \            }

      \            #hex1 {

      \                font-size: 30px;

      \                animation: wobble 3s infinite;

      \                animation-delay: 200ms;

      \            }

      \            #hex1, #hex1:before, #hex1:after {

      \                background-color: #ccc;

      \            }

      \            #hex2 {

      \                font-size: 20px;

      \                animation: wobble 3s infinite;

      \                animation-delay: 100ms;

      \            }

      \            #hex2, #hex2:before, #hex2:after {

      \                background-color: #999;

      \            }

      \            #hex3 {

      \                font-size: 10px;

      \                animation: wobble 3s infinite;

      \                animation-delay: 0ms;

      \            }

      \            #hex3, #hex3:before, #hex3:after {

      \                background-color: #666;

      \            }

      \            .hex {

      \                position: absolute;

      \                left: -0.5em;

      \                top: -0.87em;

      \                border-width: 0.1px;

      \                border-width: 0;

      \                border-style: solid none;

      \                width: 1em;

      \                height: 1.74em;

      \            }

      \            .hex:before {

      \                content: \"\";

      \                position: absolute;

      \                border: inherit;

      \                width: 100%;

      \                height: 100%;

      \                transform: rotate(-60deg);

      \            }

      \            .hex:after {

      \                content: \"\";

      \                position: absolute;

      \                border: inherit;

      \                width: 100%;

      \                height: 100%;

      \                transform: rotate(60deg);

      \            }

      \            @keyframes wobble {

      \                0% { transform: rotate(-90deg); transition: ease-in-out; }

      \                50% { transform: rotate(90deg); transition: ease-in-out; }

      \                100% { transform: rotate(-90deg); transition: ease-in-out; }

      \            }

      \        </style>

      \        <div class=\"w3-display-container w3-padding-64\">

      \            <div class=\"w3-display-middle\">

      \                <div id=\"hex1\" class=\"hex\"></div>

      \                <div id=\"hex2\" class=\"hex\"></div>

      \                <div id=\"hex3\" class=\"hex\"></div>

      \            </div>

      \        </div>

      \    "
