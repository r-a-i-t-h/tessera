    html: "<p class='w3-large'>These ideas are only half-baked, or maybe even more raw than that. But they are recorded here because I shall forget them otherwise. It's a sign of age.</p><div class='w3-section' id='headings_menu'></div><div class=\"w3-row-padding w3-stretch\"><div class=\"w3-twothird \"><h2>My half-baked idea 1</h2><p>This would be some kind of explanation of some kind of idea, with a picture to accompany it. I'd like to come up with a more dynamic iterator for these itesms. Does iterated content need to contain zones? That's a key question. At the moment, the inner content is rendered up-front so that the zones can be parsed. I definitely want to be able to render the content later. So the question is really... do I want to parse zones from dynamically rendered content? Would need more robust reference and dependency management - it's easy at the moment as I only have to add and not remove.<p></div><div class=\"w3-third w3-padding-16\">

