      \            <p class=\"w3-large\">Tessera stands for zone-based site tiles and is a very lightweight library for dynamically rendering HTML from JSON data where the data items are both templates and content.</p>

      \            <p>The also-very-lightweight and really-rather-good W3-CSS Modern Responsive CSS Framework is the chosen rendering target, although any other framework could be used.</p>

      \            <p>This site is running from Tessera and W3-CSS.</p>

      \       \ 

