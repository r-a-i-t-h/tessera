id: master
title: Master
root:
  type: region
  children:
    - type: region
      className: w3-bar w3-theme w3-large
      children:
        - type: static
          html: '<a class="w3-bar-item w3-button" href="#home">Tessera</a>'
        - type: region
          className: w3-bar-item w3-right w3-small
          children:
            - type: component
              name: now
    - type: region
      className: w3-row
      children:
        - type: region
          tag: nav
          id: sidebar
          className: w3-col m3 l2 w3-theme-l5 w3-padding
          children:
            - type: component
              name: navCollapse
              props:
                scope: sidebar
        - type: region
          tag: main
          className: w3-col m9 l10
          children:
            - type: page
