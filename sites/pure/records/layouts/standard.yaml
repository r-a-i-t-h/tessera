id: standard
title: Standard (title + main + aside + footer)
root:
  type: region
  role: content
  children:
    - type: region
      role: main
      children:
        - type: region
          tag: h1
          className: w3-text-theme w3-padding-16
          children:
            - type: zone
              id: title
        - type: zone
          id: main
        - type: region
          role: row
          className: w3-margin-top
          children:
            - type: region
              className: w3-col m8
              children:
                - type: zone
                  id: primary
            - type: region
              className: w3-col m4
              children:
                - type: region
                  tag: h3
                  className: w3-text-theme
                  children:
                    - type: static
                      html: Aside
                - type: zone
                  id: aside
    - type: region
      tag: footer
      role: footer
      className: w3-theme-l3 w3-margin-top
      children:
        - type: zone
          id: footer
