<!DOCTYPE html>
<html lang="en">

<head>
  <title>Millers Ark</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../css/w3.css?4.13">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/solid.min.css?5.11.2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/fontawesome.min.css?5.11.2">
  <script src="../js/rectem-core.js?1.2.0"></script>
  <script src="../js/rectem-spa.js?1.3.0"></script>
  <script src="../js/helpers.js?1.1.1"></script>
  <script src="../js/w3css-helper.js?1.2.0"></script>

  <link rel="stylesheet" href="../css/common.css?1.0.0">
  <link rel="stylesheet" href="../css/w3-themes/w3-theme-indigo.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Chilanka">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Delius">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Mali">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Pangolin">
  <link rel="stylesheet" href="./site.css?20200127">
  <script src="./js/site.js?1.0.0"></script>
  <script>
    var spa = new RecTemSpa("millersark", ["./data/templates.js", "./data/pages.js", "./data/pages-converted.js", "./data/dynamic.js", "./data/nav.js"]);
    spa.add_post_processing_hook(htm => htm.replace(/\/Web\/Site\//g, "https://www.millersark.co.uk/Web/Site/"));
  </script>
</head>

<body class="rightnav">

  <div class="w3-top">
    <div class="w3-bar w3-theme w3-left-align w3-large">
      <a href="#" class="w3-bar-item logo"></a>
      <a class="w3-bar-item w3-button w3-right w3-hide-large w3-hover-white w3-large w3-theme-l1"
        href="javascript:void(0)" onclick="w3_open()"><i class="fa fa-bars"></i></a>
      <div class="w3-bar-item w3-text-yellow w3-large">Miller's Ark</div>
    </div>
  </div>

  <nav id="mySidebar" class="w3-sidebar w3-bar-block w3-collapse w3-normal w3-theme-white w3-container">
    <a href="javascript:void(0)" onclick="w3_close()"
      class="w3-right w3-xlarge w3-padding-large w3-hover-theme w3-hide-large" title="Close Menu"><i
        class="fa fa-remove"></i></a>
    <h4 class="w3-bar-item"><b>Pages</b></h4>
    <div class="nav_data"></div>
    <div class="w3-bar-item w3-border-bottom"></div>
    <div class="w3-bar-item w3-button w3-tiny"
      onclick="(cl => (nav => cl.remove('leftnav', 'rightnav') || cl.add(nav))(cl.contains('leftnav') ? 'rightnav' : 'leftnav'))(document.body.classList); return false;">
      flip menu
    </div>
    <div class="w3-tiny">
      <div class="w3-left w3-button" onclick="return body_switch.switch('font', 0)">font A</div>
      <div class="w3-left w3-button" onclick="return body_switch.switch('font', 1)">font B</div>
      <div class="w3-left w3-button" onclick="return body_switch.switch('font', 2)">font C</div>
      <div class="w3-left w3-button" onclick="return body_switch.switch('font', 3)">font D</div>
    </div>
  </nav>

  <div class="w3-overlay w3-hide-large" onclick="w3_close()" style="cursor:pointer" title="close side menu"
    id="myOverlay"></div>

  <div id="rectem" class="w3-main"></div>

  <script>
    var mySidebar = document.getElementById("mySidebar");
    var overlayBg = document.getElementById("myOverlay");
    function w3_open() {
      if (mySidebar.style.display === 'block') {
        mySidebar.style.display = 'none';
        overlayBg.style.display = "none";
      } else {
        mySidebar.style.display = 'block';
        overlayBg.style.display = "block";
      }
    }
    function w3_close() {
      mySidebar.style.display = "none";
      overlayBg.style.display = "none";
    }
  </script>

</body>

</html>
